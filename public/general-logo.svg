<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Bloom Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feGaussianBlur stdDeviation="4" result="blur3" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="darkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160F0A" />
      <stop offset="60%" stop-color="#0D0805" />
      <stop offset="100%" stop-color="#070403" />
    </radialGradient>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="512" height="512" fill="url(#darkBg)" />

  <!-- Glowing Emblem Group -->
  <g filter="url(#neonGlow)">
    <!-- Outer Shield Outline -->
    <path
      d="M256 120 C296 142 344 148 376 154 C382 220 382 290 338 354 C304 404 268 424 256 428 C244 424 208 404 174 354 C130 290 130 220 136 154 C168 148 216 142 256 120 Z"
      fill="none"
      stroke="#FF5E1E"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Checkmark -->
    <path
      d="M204 274 L244 316 L318 226"
      fill="none"
      stroke="#FF5E1E"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>